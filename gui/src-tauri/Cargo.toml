[package]
name = "tipack"
version = "2.1.0"
description = "TIPACK: installer, Doctor, tune-up & debloat untuk Windows, macOS dan Linux"
authors = ["KouMac (fk0u)"]
license = "MIT"
repository = "https://github.com/fk0u/tipack"
edition = "2021"
rust-version = "1.77"

[lib]
name = "tipack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
